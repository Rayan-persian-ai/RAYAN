# RAYAN — Android APK build (Capacitor 6 shell around apps/web).
# Debug APK: always built and uploaded.
# Release APK: built + signed ONLY when all four signing secrets exist:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# The keystore is decoded to $RUNNER_TEMP for the job only and deleted afterwards.
# Optional repo variable: RAYAN_API_BASE_URL (https URL of the API Worker).
# Artifacts only — nothing is published to a GitHub Release or a store.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Override API base URL (https://…); empty = repo variable RAYAN_API_BASE_URL"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAYAN_API_BASE_URL: ${{ inputs.api_base_url || vars.RAYAN_API_BASE_URL }}
      VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.RAYAN_API_BASE_URL }}
      MOBILE_DIR: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/*.gradle*
            apps/mobile/android/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(node -p "require('./${MOBILE_DIR}/package.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          # versionCode must increase monotonically; run_number does.
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Android version: ${name} (${GITHUB_RUN_NUMBER})"

      - name: Install workspace dependencies
        run: npm ci

      - name: Build web app (apps/web -> apps/web/dist)
        run: npm run build -w @rayan/web

      - name: Install mobile shell dependencies
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm ci

      - name: Capacitor sync (copy web build + plugins)
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm run sync

      - name: Assemble debug APK
        working-directory: ${{ env.MOBILE_DIR }}/android
        env:
          RAYAN_VERSION_CODE: ${{ steps.version.outputs.code }}
          RAYAN_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rayan-android-debug-${{ steps.version.outputs.name }}
          path: ${{ env.MOBILE_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KS_B64" && -n "$KS_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release signing: enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets not set — skipping signed release APK (debug APK still uploaded)."
          fi

      - name: Decode keystore (temporary, never committed)
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/rayan-release.jks"
          test -s "$RUNNER_TEMP/rayan-release.jks"

      - name: Assemble signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ${{ env.MOBILE_DIR }}/android
        env:
          RAYAN_KEYSTORE_FILE: ${{ runner.temp }}/rayan-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RAYAN_VERSION_CODE: ${{ steps.version.outputs.code }}
          RAYAN_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release signature
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          apk="${MOBILE_DIR}/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk" || { echo "::error::signed app-release.apk not found"; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rayan-android-release-${{ steps.version.outputs.name }}
          path: ${{ env.MOBILE_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rayan-release.jks"
