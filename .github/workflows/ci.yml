name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: install · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Agent registry migration is up to date with manifests
        run: |
          npm run gen:agents-sql -w @rayan/api
          git diff --exit-code -- apps/api/migrations

      # Root scripts run every workspace (shared, cortex, autopilot, api, web). @rayan/api's pre-scripts build
      # @rayan/cortex + @rayan/autopilot first, because the API imports their dist/ output.
      - name: Typecheck
        run: npm run typecheck

      - name: Test (modules on Node 22 incl. node:sqlite; API in workerd + local D1; AI mocked, no network/paid calls)
        run: npm test

      - name: Build (cortex/autopilot dist, web bundle, Worker dry-run bundle; no Cloudflare credentials needed)
        run: npm run build
