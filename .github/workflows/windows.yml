# RAYAN — Windows desktop build (Tauri v2 shell around apps/web).
# Produces an NSIS .exe installer and an .msi, uploaded as workflow artifacts.
# Optional code signing (Authenticode) when BOTH secrets exist:
#   WINDOWS_CERTIFICATE           base64 of a .pfx code-signing certificate
#   WINDOWS_CERTIFICATE_PASSWORD  its password
# Optional repo variable: RAYAN_API_BASE_URL. Artifacts only — no public release.
name: Windows desktop

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Override API base URL (https://…); empty = repo variable RAYAN_API_BASE_URL"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build installers
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RAYAN_API_BASE_URL: ${{ inputs.api_base_url || vars.RAYAN_API_BASE_URL }}
      VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.RAYAN_API_BASE_URL }}
      DESKTOP_DIR: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            raw="${GITHUB_REF_NAME#v}"
          else
            raw="$(node -p "require('./${DESKTOP_DIR}/package.json').version")"
          fi
          # MSI needs a plain numeric MAJOR.MINOR.PATCH — drop any -pre/+build suffix.
          ver="${raw%%[-+]*}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$raw' is not semver (expected vX.Y.Z tag)"; exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "label=${raw}" >> "$GITHUB_OUTPUT"
          echo "Desktop version: ${ver} (from ${raw})"

      - name: Install workspace dependencies
        run: npm ci

      - name: Build web app (apps/web -> apps/web/dist)
        run: npm run build -w @rayan/web

      - name: Install desktop shell dependencies
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm ci

      - name: Import code-signing certificate (optional)
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Output "::notice::Windows signing secrets not set - building UNSIGNED installers."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "rayan-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          "enabled=true" >> $env:GITHUB_OUTPUT
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Write-Output "Certificate imported."

      - name: Write Tauri build overrides
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_ENABLED: ${{ steps.signing.outputs.enabled }}
          THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          node -e '
            const o = { version: process.env.VERSION };
            if (process.env.SIGN_ENABLED === "true") {
              o.bundle = { windows: {
                certificateThumbprint: process.env.THUMBPRINT,
                digestAlgorithm: "sha256",
                timestampUrl: "http://timestamp.digicert.com"
              } };
            }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/tauri.override.json", JSON.stringify(o, null, 2));
          '
          cat "$RUNNER_TEMP/tauri.override.json"

      - name: Tauri build (NSIS + MSI)
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npx tauri build --ci --bundles nsis,msi --config "$RUNNER_TEMP/tauri.override.json"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: rayan-windows-${{ steps.version.outputs.label }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Remove certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: Remove-Item -Path "Cert:\CurrentUser\My\$env:THUMBPRINT" -ErrorAction SilentlyContinue
