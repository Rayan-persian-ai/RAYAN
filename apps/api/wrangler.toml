# RAYAN API — Cloudflare Worker (free plan).
name = "rayan-api"
main = "src/index.ts"
compatibility_date = "2025-11-01"
workers_dev = true

# Created with: npx wrangler d1 create rayan-db
# The deploy workflow resolves/creates the real id by name and injects it at deploy time,
# so the placeholder below is safe to commit. For manual deploys paste your database_id here locally.
[[d1_databases]]
binding = "DB"
database_name = "rayan-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Workers AI (free: 10,000 neurons/day). Guarded by the Cost Controller (AI_DAILY_LIMIT).
[ai]
binding = "AI"

# Cron Trigger: task processor + maintenance + heartbeat every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

# Non-secret configuration. Secrets (OWNER_EMAIL) are set with `wrangler secret put` — never here.
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://rayan-web.pages.dev"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
AI_DAILY_LIMIT = "200"
RATE_LIMIT_API_PER_MIN = "120"
RATE_LIMIT_AUTH_PER_MIN = "10"
RATE_LIMIT_LOGIN_PER_EMAIL_15MIN = "10"
RATE_LIMIT_CHAT_PER_MIN = "10"
PBKDF2_ITERATIONS = "100000"
SESSION_TTL_HOURS = "168"

[observability]
enabled = true
