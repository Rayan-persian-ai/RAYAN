[package]
name = "rayan-desktop"
version = "0.1.0"
description = "RAYAN Windows desktop shell"
authors = ["RAYAN"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# The _lib suffix avoids a name clash with the bin target on Windows.
name = "rayan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
